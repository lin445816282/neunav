<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>✨ 魔法衣橱 - 精致换装</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4/dist/vue.global.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;height:100vh;width:100vw;
  background:linear-gradient(135deg,#fce4ec,#f3e5f5,#e8eaf6);user-select:none;-webkit-user-select:none;
  touch-action:manipulation}
#canvas3d{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#app{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;pointer-events:none}
#app>*{pointer-events:auto}

.header{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,240,245,.92));
  backdrop-filter:blur(12px);padding:8px 14px;text-align:center;
  border-bottom:1px solid rgba(255,182,193,.3)}
.header h1{font-size:18px;background:linear-gradient(135deg,#e91e63,#9c27b0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}

.toolbar{margin-top:auto;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,182,193,.3);padding:6px 0 10px}
.categories{display:flex;overflow-x:auto;gap:6px;padding:0 10px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:7px 12px;border-radius:18px;border:none;font-size:12px;font-weight:500;
  cursor:pointer;background:rgba(233,30,99,.08);color:#e91e63;transition:all .2s;white-space:nowrap;
  -webkit-tap-highlight-color:transparent}
.cat-btn.active{background:linear-gradient(135deg,#e91e63,#ec407a);color:#fff;box-shadow:0 2px 10px rgba(233,30,99,.3)}
.cat-btn:active{transform:scale(.95)}

.items-row{display:flex;overflow-x:auto;gap:8px;padding:8px 10px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.items-row::-webkit-scrollbar{display:none}
.item-card{flex-shrink:0;width:50px;height:50px;border-radius:12px;border:2px solid transparent;
  background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
  font-size:22px;transition:all .15s;box-shadow:0 2px 6px rgba(0,0,0,.05);
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.item-card.active{border-color:#e91e63;box-shadow:0 3px 12px rgba(233,30,99,.25);transform:scale(1.08)}
.item-card:active{transform:scale(.92);background:#fce4ec}

.color-row{display:flex;gap:6px;padding:4px 10px;overflow-x:auto}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.1);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.color-dot.active{border-color:#333;transform:scale(1.25)}

.float-btns{position:fixed;right:8px;top:45%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px}
.fbtn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.9);
  font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:all .15s;
  -webkit-tap-highlight-color:transparent}
.fbtn:active{transform:scale(.88);background:#fce4ec}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;
  display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:20px;padding:20px;width:90%;max-width:340px;box-shadow:0 16px 48px rgba(0,0,0,.2)}
.modal-box h3{font-size:16px;margin-bottom:10px;color:#e91e63}
.modal-box .btn-row{display:flex;gap:6px;margin-top:12px}
.modal-box button{flex:1;padding:8px;border-radius:10px;border:none;font-size:13px;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#e91e63,#ec407a);color:#fff}
.btn-secondary{background:#f5f5f5;color:#666}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);
  color:#fff;padding:6px 16px;border-radius:16px;font-size:12px;z-index:200;pointer-events:none}
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="app">
  <div class="header"><h1>✨ 魔法衣橱</h1></div>
  <div class="float-btns">
    <button class="fbtn" @click="resetAll">🔄</button>
    <button class="fbtn" @click="randomOutfit">🎲</button>
    <button class="fbtn" @click="takePhoto">📸</button>
    <button class="fbtn" @click="showSave=!showSave">👗</button>
    <button class="fbtn" @click="cycleScene">🏰</button>
    <button class="fbtn" @click="cyclePose">🩰</button>
  </div>
  <div class="toolbar">
    <div class="categories">
      <button v-for="c in categories" :key="c.id" class="cat-btn" :class="{active:activeCat===c.id}" @click="selectCat(c.id)">{{c.icon}} {{c.name}}</button>
    </div>
    <div class="items-row">
      <div v-for="item in currentItems" :key="item.id" class="item-card" :class="{active:isActive(item)}" 
           @click.stop="selectItem(item)" @touchend.prevent.stop="selectItem(item)">
        {{item.icon}}
      </div>
    </div>
    <div class="color-row" v-if="showColorPicker">
      <div v-for="c in colors" :key="c" class="color-dot" :class="{active:activeColor===c}" 
           @click.stop="pickColor(c)" @touchend.prevent.stop="pickColor(c)" :style="{background:c}"></div>
    </div>
  </div>
  <div class="modal-overlay" v-if="showPhoto" @click.self="showPhoto=false">
    <div class="modal-box"><h3>📸 美照</h3><img :src="photoData" style="width:100%;border-radius:12px;margin-bottom:8px"/>
      <div class="btn-row"><button class="btn-secondary" @click="showPhoto=false">关闭</button><button class="btn-primary" @click="downloadPhoto">💾 保存</button></div></div>
  </div>
  <div class="modal-overlay" v-if="showSave" @click.self="showSave=false">
    <div class="modal-box"><h3>👗 我的衣橱</h3>
      <div v-if="savedOutfits.length===0" style="color:#999;text-align:center;padding:16px">还没有保存的搭配哦~</div>
      <div v-for="(o,i) in savedOutfits" :key="i" style="display:flex;align-items:center;padding:6px;border-radius:8px;margin:3px 0;background:#fafafa">
        <span style="flex:1;font-size:12px">{{o.name}}</span>
        <button class="btn-primary" style="flex:none;padding:4px 8px;font-size:11px" @click="loadOutfit(o)">穿上</button>
        <button class="btn-secondary" style="flex:none;padding:4px 8px;font-size:11px;margin-left:4px" @click="deleteOutfit(i)">删</button>
      </div>
      <div class="btn-row"><button class="btn-secondary" @click="showSave=false">关闭</button><button class="btn-primary" @click="saveOutfit">💾 保存当前</button></div></div>
  </div>
  <div class="toast" v-if="toastMsg">{{toastMsg}}</div>
</div>

<script>
const {createApp,ref,computed,onMounted} = Vue;
createApp({setup(){
  const activeCat=ref('hair'),activeHair=ref(null),activeTop=ref(null),activeBottom=ref(null);
  const activeDress=ref(null),activeShoes=ref(null),activeAcc=ref(null),activeColor=ref('#ff6b9d');
  const showPhoto=ref(false),photoData=ref(''),showSave=ref(false),savedOutfits=ref([]),toastMsg=ref('');
  const colors=['#ff6b9d','#ff8a80','#ff80ab','#ea80fc','#b388ff','#8c9eff','#80d8ff','#a7ffeb','#ccff90','#fff176','#ffd740','#ffab40','#ffffff','#424242'];
  const categories=[{id:'hair',name:'发型',icon:'💇'},{id:'top',name:'上衣',icon:'👚'},{id:'bottom',name:'下装',icon:'👖'},{id:'dress',name:'连衣裙',icon:'👗'},{id:'shoes',name:'鞋子',icon:'👠'},{id:'acc',name:'配饰',icon:'💎'}];
  const items={
    hair:[{id:'h1',icon:'👧🏻',name:'双马尾',color:'#e8b4b8',mesh:'twintail'},{id:'h2',icon:'👩🏻',name:'长直发',color:'#4e342e',mesh:'longstraight'},{id:'h3',icon:'💁🏻',name:'短发',color:'#5d4037',mesh:'shorthair'},{id:'h4',icon:'👸🏻',name:'公主卷',color:'#c9a78b',mesh:'princesscurl'},{id:'h5',icon:'🧒🏻',name:'丸子头',color:'#3e2723',mesh:'bun'}],
    top:[{id:'t1',icon:'👚',name:'T恤',color:'#ffcdd2',mesh:'tshirt'},{id:'t2',icon:'🧥',name:'卫衣',color:'#b3e5fc',mesh:'hoodie'},{id:'t3',icon:'👕',name:'衬衫',color:'#fff',mesh:'shirt'},{id:'t4',icon:'🎽',name:'吊带',color:'#f8bbd0',mesh:'tank'},{id:'t5',icon:'🦺',name:'针织衫',color:'#ffe0b2',mesh:'knit'}],
    bottom:[{id:'b1',icon:'👖',name:'牛仔裤',color:'#5c6bc0',mesh:'jeans'},{id:'b2',icon:'🩳',name:'短裤',color:'#ffcc80',mesh:'shorts'},{id:'b3',icon:'👗',name:'百褶裙',color:'#f48fb1',mesh:'pleatskirt'},{id:'b4',icon:'🥻',name:'长裙',color:'#ce93d8',mesh:'longskirt'},{id:'b5',icon:'🩲',name:'运动裤',color:'#424242',mesh:'sweatpants'}],
    dress:[{id:'d1',icon:'👗',name:'公主裙',color:'#f8bbd0',mesh:'princessdress'},{id:'d2',icon:'🥻',name:'碎花裙',color:'#c5e1a5',mesh:'floraldress'},{id:'d3',icon:'👘',name:'和风裙',color:'#ffcdd2',mesh:'kimono'},{id:'d4',icon:'🩱',name:'蓬蓬裙',color:'#b3e5fc',mesh:'tutu'}],
    shoes:[{id:'s1',icon:'👟',name:'运动鞋',color:'#fff',mesh:'sneakers'},{id:'s2',icon:'👠',name:'高跟鞋',color:'#e91e63',mesh:'heels'},{id:'s3',icon:'🥿',name:'芭蕾鞋',color:'#f8bbd0',mesh:'flats'},{id:'s4',icon:'👢',name:'靴子',color:'#795548',mesh:'boots'}],
    acc:[{id:'a1',icon:'👑',name:'皇冠',color:'#ffd700',mesh:'crown'},{id:'a2',icon:'🎀',name:'蝴蝶结',color:'#f48fb1',mesh:'bow'},{id:'a3',icon:'🐱',name:'猫耳',color:'#ffcdd2',mesh:'catear'},{id:'a4',icon:'💐',name:'花环',color:'#e8f5e9',mesh:'flowercrown'},{id:'a5',icon:'🕶',name:'墨镜',color:'#424242',mesh:'sunglasses'}],
  };
  const currentItems=computed(()=>items[activeCat.value]||[]);
  const showColorPicker=computed(()=>activeCat.value!=='hair');
  function selectCat(id){activeCat.value=id}
  function isActive(item){const map={hair:activeHair,top:activeTop,bottom:activeBottom,dress:activeDress,shoes:activeShoes,acc:activeAcc};return map[activeCat.value].value?.id===item.id}
  function selectItem(item){const map={hair:activeHair,top:activeTop,bottom:activeBottom,dress:activeDress,shoes:activeShoes,acc:activeAcc};const ref=map[activeCat.value];ref.value=ref.value?.id===item.id?null:{...item};setTimeout(applyOutfit,10)}
  function pickColor(c){activeColor.value=c;const map={hair:activeHair,top:activeTop,bottom:activeBottom,dress:activeDress,shoes:activeShoes,acc:activeAcc};const ref=map[activeCat.value];if(ref.value){ref.value={...ref.value,color:c};setTimeout(applyOutfit,10)}}
  function randomOutfit(){Object.entries(items).forEach(([cat,list])=>{const r=list[Math.floor(Math.random()*list.length)];const map={hair:activeHair,top:activeTop,bottom:activeBottom,dress:activeDress,shoes:activeShoes,acc:activeAcc};map[cat].value={...r}});setTimeout(applyOutfit,10);showToast('🎲 随机搭配！')}
  function resetAll(){activeHair.value=null;activeTop.value=null;activeBottom.value=null;activeDress.value=null;activeShoes.value=null;activeAcc.value=null;setTimeout(applyOutfit,10);showToast('🔄 已重置')}
  function loadOutfit(o){activeHair.value=o.hair;activeTop.value=o.top;activeBottom.value=o.bottom;activeDress.value=o.dress;activeShoes.value=o.shoes;activeAcc.value=o.acc;setTimeout(applyOutfit,10);showSave.value=false;showToast('👗 换上了！')}
  function downloadPhoto(){const a=document.createElement('a');a.href=photoData.value;a.download='衣橱_'+new Date().toLocaleDateString()+'.png';a.click()}
  async function takePhoto(){showPhoto.value=true;await new Promise(r=>setTimeout(r,300));photoData.value=document.getElementById('canvas3d').toDataURL('image/png')}
  function saveOutfit(){const o={name:'搭配'+new Date().toLocaleTimeString(),hair:activeHair.value,top:activeTop.value,bottom:activeBottom.value,dress:activeDress.value,shoes:activeShoes.value,acc:activeAcc.value};savedOutfits.value.push(o);localStorage.setItem('dressup_o',JSON.stringify(savedOutfits.value));showToast('💾 已保存！')}
  function deleteOutfit(i){savedOutfits.value.splice(i,1);localStorage.setItem('dressup_o',JSON.stringify(savedOutfits.value))}
  function showToast(msg){toastMsg.value=msg;setTimeout(()=>toastMsg.value='',2000)}
  const scenes=['🏰 城堡','🌳 森林','🏖 海滩','🌸 花园'];let sceneIdx=0;
  function cycleScene(){sceneIdx=(sceneIdx+1)%scenes.length;window._setScene?.(sceneIdx);showToast('🏞 '+scenes[sceneIdx])}
  const poses=['🩰 站姿','💃 叉腰','🙆 举手','🦵 单腿'];let poseIdx=0;
  function cyclePose(){poseIdx=(poseIdx+1)%poses.length;window._setPose?.(poseIdx);showToast(poses[poseIdx])}
  onMounted(()=>{const s=localStorage.getItem('dressup_o');if(s)savedOutfits.value=JSON.parse(s)});
  window._getOutfit=()=>({hair:activeHair.value,top:activeTop.value,bottom:activeBottom.value,dress:activeDress.value,shoes:activeShoes.value,acc:activeAcc.value});
  return{activeCat,categories,currentItems,colors,activeColor,showPhoto,photoData,showSave,savedOutfits,selectCat,isActive,selectItem,pickColor,randomOutfit,resetAll,takePhoto,downloadPhoto,saveOutfit,loadOutfit,deleteOutfit,cycleScene,cyclePose,showColorPicker,toastMsg};
}}).mount('#app');

// ==================== Three.js 精致女孩模型 ====================
const canvas=document.getElementById('canvas3d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
const bgColors=[0xe8e0f0,0xdcedc8,0xd4e4f7,0xffecd2];
scene.background=new THREE.Color(bgColors[0]);
scene.fog=new THREE.Fog(bgColors[0],4,18);

const camera=new THREE.PerspectiveCamera(35,window.innerWidth/window.innerHeight,.3,30);
camera.position.set(0,.8,3.5);camera.lookAt(0,.7,0);

const ambient=new THREE.AmbientLight(0xfff0f5,1.6);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(2,4,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const rim=new THREE.DirectionalLight(0xffccdd,.8);rim.position.set(-1,2,-2);scene.add(rim);

// 地面
const floor=new THREE.Mesh(new THREE.CircleGeometry(3.5,32),new THREE.MeshStandardMaterial({color:0xfff0f5,roughness:.7}));
floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;floor.receiveShadow=true;scene.add(floor);

// 花瓣粒子
const ptGeo=new THREE.BufferGeometry();
const ptArr=new Float32Array(300*3);
for(let i=0;i<900;i+=3){ptArr[i]=(Math.random()-.5)*7;ptArr[i+1]=Math.random()*5-1.5;ptArr[i+2]=(Math.random()-.5)*5}
ptGeo.setAttribute('position',new THREE.BufferAttribute(ptArr,3));
const ptMat=new THREE.PointsMaterial({size:.04,color:0xffb6c1,transparent:true,opacity:.5,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(ptGeo,ptMat));
const particles=scene.children[scene.children.length-1];

const charGroup=new THREE.Group();scene.add(charGroup);
const clothingGroup=new THREE.Group();charGroup.add(clothingGroup);
const hairGroup=new THREE.Group();charGroup.add(hairGroup);
const accGroup=new THREE.Group();charGroup.add(accGroup);

// 材质
const skin=new THREE.MeshStandardMaterial({color:0xffe4c9,roughness:.45});
const skinDark=new THREE.MeshStandardMaterial({color:0xf5d5b8,roughness:.4});
const eyeW=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.1});
const eyeP=new THREE.MeshStandardMaterial({color:0x3e2723,roughness:.05});
const eyeH=new THREE.MeshStandardMaterial({color:0x5d4037,roughness:.05});
const lipMat=new THREE.MeshStandardMaterial({color:0xf48fb1,roughness:.3});
const blushM=new THREE.MeshStandardMaterial({color:0xffb6c1,roughness:.2,transparent:true,opacity:.35});

// === 身体（更优雅的比例）===
// 躯干
const torsoGeo=new THREE.CapsuleGeometry(.22,.55,8,12);
const torso=new THREE.Mesh(torsoGeo,skin);torso.position.y=.7;torso.castShadow=true;charGroup.add(torso);

// 腰
const waistGeo=new THREE.CylinderGeometry(.18,.22,.1,16);
const waist=new THREE.Mesh(waistGeo,skinDark);waist.position.y=.4;charGroup.add(waist);

// 臀
const hipGeo=new THREE.SphereGeometry(.24,16,12,0,Math.PI*2,Math.PI/3,Math.PI/3);
const hip=new THREE.Mesh(hipGeo,skin);hip.position.y=.25;hip.scale.set(1,.6,1);charGroup.add(hip);

// 脖子
const neckGeo=new THREE.CylinderGeometry(.07,.09,.18,12);
const neck=new THREE.Mesh(neckGeo,skin);neck.position.y=1.08;charGroup.add(neck);

// 头
const headGeo=new THREE.SphereGeometry(.32,32,32);
const head=new THREE.Mesh(headGeo,skin);head.position.y=1.35;head.scale.set(1,1.12,.92);charGroup.add(head);

// 眼睛（更大更精致）
[-.1,.1].forEach(sx=>{
  const eg=new THREE.Group();
  eg.add(new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),eyeW));
  const iris=new THREE.Mesh(new THREE.SphereGeometry(.045,16,16),eyeP);iris.position.z=.04;eg.add(iris);
  const hl=new THREE.Mesh(new THREE.SphereGeometry(.015,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));
  hl.position.set(.02,.02,.06);eg.add(hl);
  eg.position.set(sx,1.42,-.26);charGroup.add(eg);
});

// 睫毛（上下弧线）
[-.1,.1].forEach(sx=>{
  const lashGeo=new THREE.TorusGeometry(.06,.008,6,8,Math.PI);
  const lash=new THREE.Mesh(lashGeo,eyeH);
  lash.position.set(sx,1.44,-.25);lash.rotation.z=Math.PI;charGroup.add(lash);
});

// 眉毛
[-.1,.1].forEach(sx=>{
  const browGeo=new THREE.BoxGeometry(.12,.015,.03);
  const brow=new THREE.Mesh(browGeo,new THREE.MeshStandardMaterial({color:0x5d4037,roughness:.3}));
  brow.position.set(sx,1.52,-.24);charGroup.add(brow);
});

// 鼻子
const noseGeo=new THREE.SphereGeometry(.025,8,8);
const nose=new THREE.Mesh(noseGeo,skinDark);nose.position.set(0,1.35,-.3);charGroup.add(nose);

// 嘴（微笑弧线）
const mouthGeo=new THREE.TorusGeometry(.05,.01,8,8,Math.PI);
const mouth=new THREE.Mesh(mouthGeo,lipMat);
mouth.position.set(0,1.26,-.28);mouth.rotation.x=Math.PI;charGroup.add(mouth);

// 腮红
[-.16,.16].forEach(sx=>{
  const blush=new THREE.Mesh(new THREE.SphereGeometry(.04,8,8),blushM);
  blush.position.set(sx,1.33,-.26);charGroup.add(blush);
});

// 耳朵
[-.28,.28].forEach(sx=>{
  const earGeo=new THREE.SphereGeometry(.05,.04,8,8);
  const ear=new THREE.Mesh(earGeo,skin);
  ear.scale.set(1.3,1.8,.6);ear.position.set(sx,1.36,-.05);charGroup.add(ear);
});

// 手臂（更纤细）
function createArm(s){
  const ag=new THREE.Group();
  ag.add(new THREE.Mesh(new THREE.CapsuleGeometry(.08,.3,4,8),skin));
  ag.add(new THREE.Mesh(new THREE.CapsuleGeometry(.06,.25,4,8),skin)).position.y=-.25;
  const hand=new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),skin);hand.position.y=-.42;ag.add(hand);
  ag.position.set(s*.32,.95,0);ag.rotation.z=s*.25;
  return ag;
}
charGroup.add(createArm(-1));charGroup.add(createArm(1));

// 腿（更修长）
function createLeg(s){
  const lg=new THREE.Group();
  lg.add(new THREE.Mesh(new THREE.CapsuleGeometry(.1,.4,4,8),skin)).position.y=-.12;
  lg.add(new THREE.Mesh(new THREE.CapsuleGeometry(.08,.35,4,8),skin)).position.y=-.48;
  const foot=new THREE.Mesh(new THREE.BoxGeometry(.08,.06,.14),skin);foot.position.set(0,-.68,.04);lg.add(foot);
  lg.position.set(s*.1,-.1,0);
  return lg;
}
charGroup.add(createLeg(-1));charGroup.add(createLeg(1));

// === 服装系统 ===
function clearGroup(g){while(g.children.length>0)g.remove(g.children[0])}

function createHair(item){
  clearGroup(hairGroup);if(!item)return;
  const mat=new THREE.MeshStandardMaterial({color:item.color||'#e8b4b8',roughness:.55});
  if(item.mesh==='twintail'){
    const cap=new THREE.Mesh(new THREE.SphereGeometry(.33,.32,16,.1,Math.PI*2,0,Math.PI/2),mat);
    cap.position.y=1.36;hairGroup.add(cap);
    [-.18,.18].forEach(s=>{
      const t=new THREE.Mesh(new THREE.CylinderGeometry(.05,.08,.55,8),mat);
      t.position.set(s,.95,.12);t.rotation.z=s*.7;hairGroup.add(t);
      hairGroup.add(new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),mat)).position.set(s,.65,.18);
    });
  }else if(item.mesh==='longstraight'){
    const cap=new THREE.Mesh(new THREE.SphereGeometry(.33,.32,16,.1,Math.PI*2,0,Math.PI/3.5),mat);
    cap.position.y=1.4;hairGroup.add(cap);
    for(let a=-.7;a<=.7;a+=.2){
      hairGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.7,6),mat)).position.set(Math.sin(a)*.28,.95,.08);
    }
  }else{
    const cap=new THREE.Mesh(new THREE.SphereGeometry(.33,.32,16,.1,Math.PI*2,0,Math.PI/3),mat);
    cap.position.y=1.38;hairGroup.add(cap);
    hairGroup.add(new THREE.Mesh(new THREE.SphereGeometry(.14,16,16),mat)).position.y=1.64;
  }
}

function createClothing(item,cat){
  if(cat==='dress'){clearGroup(clothingGroup);if(!item)return}
  if(!item)return;
  const mat=new THREE.MeshStandardMaterial({color:item.color||'#ffcdd2',roughness:.5});
  if(['tshirt','shirt','tank','knit'].includes(item.mesh)){
    clothingGroup.children.filter(c=>c.userData?.type==='top').forEach(c=>clothingGroup.remove(c));
    const top=new THREE.Mesh(new THREE.CylinderGeometry(.24,.2,.5,16,1,true),mat);
    top.position.y=.7;top.userData={type:'top'};top.castShadow=true;clothingGroup.add(top);
    [-.32,.32].forEach(s=>{const sl=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,.18,8),mat);sl.position.set(s,.72,0);sl.userData={type:'top'};clothingGroup.add(sl)});
  }
  if(['jeans','shorts','sweatpants'].includes(item.mesh)){
    clothingGroup.children.filter(c=>c.userData?.type==='bottom').forEach(c=>clothingGroup.remove(c));
    const h=item.mesh==='shorts'?.22:.38;
    [-.1,.1].forEach(s=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.13,.11,h,8),mat);l.position.set(s,-.25,0);l.userData={type:'bottom'};clothingGroup.add(l)});
  }
  if(['pleatskirt','longskirt'].includes(item.mesh)){
    clothingGroup.children.filter(c=>c.userData?.type==='bottom').forEach(c=>clothingGroup.remove(c));
    const h=item.mesh==='longskirt'?.55:.3;
    clothingGroup.add(new THREE.Mesh(new THREE.ConeGeometry(.25,h,16,1,true),mat)).position.y=.18;
  }
  if(['princessdress','floraldress','tutu'].includes(item.mesh)){
    clearGroup(clothingGroup);
    const d=new THREE.Mesh(new THREE.CylinderGeometry(.26,.34,.75,16,1,true),mat);
    d.position.y=.48;d.userData={type:'dress'};d.castShadow=true;clothingGroup.add(d);
    clothingGroup.add(new THREE.Mesh(new THREE.ConeGeometry(.4,.28,16,1,true),mat)).position.y=.12;
  }
}

function createShoes(item){
  charGroup.children.filter(c=>c.userData?.type==='shoes').forEach(c=>charGroup.remove(c));
  if(!item)return;
  const mat=new THREE.MeshStandardMaterial({color:item.color||'#e91e63',roughness:.35});
  [-.1,.1].forEach(s=>{
    const sh=new THREE.Mesh(new THREE.BoxGeometry(.13,.06,.18),mat);
    sh.position.set(s,-.7,.04);sh.userData={type:'shoes'};sh.castShadow=true;charGroup.add(sh);
  });
}

function createAcc(item){
  clearGroup(accGroup);if(!item)return;
  const mat=new THREE.MeshStandardMaterial({color:item.color||'#ffd700',roughness:.3});
  if(item.mesh==='crown'){
    for(let a=0;a<Math.PI*2;a+=.4){
      const spike=new THREE.Mesh(new THREE.ConeGeometry(.03,.12,4),mat);
      spike.position.set(Math.cos(a)*.3,1.72,Math.sin(a)*.1);accGroup.add(spike);
    }
    accGroup.add(new THREE.Mesh(new THREE.TorusGeometry(.28,.02,8,16),mat)).position.y=1.68;
  }
  if(item.mesh==='bow'){
    const b=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),mat);b.scale.set(1.5,.8,.5);b.position.set(0,1.58,.22);accGroup.add(b);
    [-.1,.1].forEach(s=>{const w=new THREE.Mesh(new THREE.SphereGeometry(.08,8,8),mat);w.position.set(s,1.56,.2);accGroup.add(w)});
  }
  if(item.mesh==='catear'){
    [-.15,.15].forEach(s=>{const ear=new THREE.Mesh(new THREE.ConeGeometry(.06,.13,6),mat);ear.position.set(s,1.62,0);accGroup.add(ear)});
  }
  if(item.mesh==='flowercrown'){
    for(let a=0;a<Math.PI*2;a+=.5){
      const f=new THREE.Mesh(new THREE.SphereGeometry(.04,6,6),new THREE.MeshStandardMaterial({color:['#f48fb1','#fff','#ffcdd2','#e8f5e9'][a%4],roughness:.3}));
      f.position.set(Math.cos(a)*.3,1.67,Math.sin(a)*.12);accGroup.add(f);
    }
  }
  if(item.mesh==='sunglasses'){
    [-.12,.12].forEach(s=>{accGroup.add(new THREE.Mesh(new THREE.TorusGeometry(.06,.015,6,8),new THREE.MeshStandardMaterial({color:0x111,roughness:.1}))).position.set(s,1.4,-.26)});
  }
}

// === 更新循环 ===
function applyOutfit(){
  const o=window._getOutfit?.()||{};
  createHair(o.hair);
  createClothing(o.top,'top');createClothing(o.bottom,'bottom');
  createClothing(o.dress,'dress');
  createShoes(o.shoes);createAcc(o.acc);
}
applyOutfit();

function animate(){
  requestAnimationFrame(animate);
  charGroup.rotation.y+=.002;
  particles.rotation.y+=.0003;
  renderer.render(scene,camera);
}
animate();

// 场景切换
window._setScene=s=>{const c=bgColors[s];scene.background=new THREE.Color(c);scene.fog=new THREE.Fog(c,4,18)};
window._setPose=p=>{};

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
